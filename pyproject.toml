[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfo-finance-assistant"
version = "1.0.0"
description = "Guardrailed agentic text-to-SQL finance assistant"
requires-python = ">=3.11,<3.14"
dependencies = ["streamlit>=1.36", "pandas>=2.2", "sqlalchemy>=2.0", "pyodbc>=5.1", "pydantic>=2.8", "langgraph>=0.2", "openai>=1.40", "python-dotenv>=1.0", "plotly>=5.23", "sqlglot>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
